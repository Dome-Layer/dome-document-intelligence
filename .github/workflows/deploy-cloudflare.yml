# Deploys the dome-document-intelligence frontend to Cloudflare Workers (Sprint H phase 2, DOME_DECISIONS
# 2026-10-01). A push to `staging` deploys the Worker dome-document-intelligence-staging; a push to `main`
# deploys dome-document-intelligence. The build is a static Next.js export (frontend/out) served as assets;
# frontend/worker adds the per-request CSP nonce and the security headers.
#
# Secrets: CLOUDFLARE_API_TOKEN (Workers-only token), CLOUDFLARE_ACCOUNT_ID.
# Variables on the GitHub environments cloudflare-staging and cloudflare-production:
# NEXT_PUBLIC_API_BASE, NEXT_PUBLIC_SENTRY_DSN, NEXT_PUBLIC_SENTRY_ENVIRONMENT (public: they ship in
# the JavaScript), and SMOKE_URL, the host the smoke test checks (the workers.dev address until the DNS cutover).

name: deploy (Cloudflare)

on:
  push:
    branches: [main, staging]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy ${{ github.ref_name }}
    if: github.ref_name == 'main' || github.ref_name == 'staging'
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name == 'main' && 'cloudflare-production' || 'cloudflare-staging' }}
      url: ${{ vars.SMOKE_URL }}
    env:
      IS_PRODUCTION: ${{ github.ref_name == 'main' }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Wrangler needs Node 22 or later.
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck:worker
      - run: npm test
      - name: Build the static export
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_API_BASE: ${{ vars.NEXT_PUBLIC_API_BASE }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
          NEXT_PUBLIC_SENTRY_ENVIRONMENT: ${{ vars.NEXT_PUBLIC_SENTRY_ENVIRONMENT }}
        run: |
          if [ -z "$NEXT_PUBLIC_API_BASE" ]; then echo "::error::NEXT_PUBLIC_API_BASE is not set on this environment"; exit 1; fi
          if [ -z "$NEXT_PUBLIC_SENTRY_DSN" ]; then echo "::warning::NEXT_PUBLIC_SENTRY_DSN is not set on this environment, browser errors will not reach Sentry"; fi
          npm run build
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          message="$(git log -1 --format=%s | cut -c1-100)"
          if [ "$IS_PRODUCTION" = "true" ]; then
            npx wrangler deploy --env="" --tag "${GITHUB_SHA::7}" --message "$message"
          else
            npx wrangler deploy --env staging --tag "${GITHUB_SHA::7}" --message "$message"
          fi
      - name: Smoke test
        env:
          HOST: ${{ vars.SMOKE_URL }}
        run: |
          fail=0
          check() { # path, expected status
            code=$(curl -s -o /dev/null -w '%{http_code}' "$HOST$1")
            echo "$1 -> $code (want $2)"; [ "$code" = "$2" ] || fail=1
          }
          sleep 5
          check / 200
          check /history 200
          check /history/ 308
          check /nope 404
          headers=$(curl -s -D - -o page.html "$HOST/" | tr -d '\r')
          nonce=$(echo "$headers" | grep -i '^content-security-policy:' | grep -oE "nonce-[A-Za-z0-9+/=]+" | cut -d- -f2-)
          if [ -z "$nonce" ]; then echo "::error::no CSP nonce on /"; fail=1; fi
          scripts=$(grep -o '<script' page.html | wc -l)
          nonced=$(grep -oF "nonce=\"$nonce\"" page.html | wc -l)
          echo "scripts=$scripts nonced=$nonced"
          if [ "$nonced" -lt "$scripts" ]; then echo "::error::a script on / has no nonce"; fail=1; fi
          robots=$(echo "$headers" | grep -i '^x-robots-tag' || true)
          if [ "$IS_PRODUCTION" = "true" ] && [ -n "$robots" ] && [[ "$HOST" != *workers.dev* ]]; then echo "::error::production answered with $robots"; fail=1; fi
          if [ "$IS_PRODUCTION" != "true" ] && [ -z "$robots" ]; then echo "::error::staging is missing noindex"; fail=1; fi
          exit $fail
